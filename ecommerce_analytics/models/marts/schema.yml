models:
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: nutriscore_grade
        data_tests:
          - accepted_values:
              values: ['a', 'b', 'c', 'd', 'e', 'unknown', 'not-applicable']
  - name: mart_sales
    columns:
      - name: total_orders
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: total_revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: avg_basket
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: unique_customers
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: year 
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 2017
             
      