models:
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: nutriscore_grade
        data_tests:
          - accepted_values:
              values: ['a', 'b', 'c', 'd', 'e', 'unknown', 'not-applicable']
  - name: mart_sales
    columns:
      - name: total_orders
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: total_revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
             config:
                severity: warn
      - name: avg_basket
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
             config:
                severity: warn
      - name: unique_customers
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 0
      - name: year 
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
             min_value: 2017
             
  - name: mart_customer_retention
    description: >
      Matrice de rétention par cohorte mensuelle.
      Chaque ligne = une cohorte × une période.
      Permet d'analyser le taux de rétention, le churn et le LTV cumulé.
    columns:
      - name: cohort_month
        description: Mois du premier achat de la cohorte (DATE tronquée au mois)
        tests:
          - not_null
      - name: period_number
        description: Nombre de mois écoulés depuis la cohorte (0 = mois d'acquisition)
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 120 ## (10 ans)
      - name: cohort_nb_customers
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: retention_rate
        description: active_customers / cohort_size
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
              config:
                severity: warn
      - name: churn_rate
        description: cohort_size - active_customer / cohort_size
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0  
              max_value: 1.0
              config:
                severity: warn

  - name: mart_product_performance
    description: >
      Monthly product performance mart used to identify growth opportunities.
      Includes revenue, volume, growth metrics (MoM), and seasonality indicators.
      Designed for dashboarding and product performance analysis.
    columns:

      - name: product_id
        description: Unique identifier of the product
        tests:
          - not_null

      - name: order_month
        description: Month of the order (truncated to month level)
        tests:
          - not_null

      - name: monthly_revenue
        description: Total revenue generated by the product for the given month
        tests:
          - not_null

      - name: units_sold
        description: Total quantity of units sold for the product in the month
        tests:
          - not_null

      - name: nb_orders
        description: Number of distinct orders containing the product in the month
        tests:
          - not_null

      - name: avg_unit_price
        description: Average price per unit sold for the product in the month

      - name: mom_growth_rate
        description: Month-over-month revenue growth rate for the product

      - name: seasonal_index
        description: >
          Seasonality index comparing monthly revenue to average monthly revenue
          of the year. Values >1 indicate above-average performance.

        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 20
              strictly: false

      - name: is_high_growth
        description: >
          Flag indicating whether the product is considered high growth
          (MoM growth > 35% and revenue > 1000) (arbitrary choice)
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - order_month